aj.help.what = \uc774 \ud654\uba74\uc740 \ubb34\uc5c7\uc778\uac00
aj.help.what.body = Confluence \ub294 \uc2a4\ud398\uc774\uc2a4\ubcc4\ub85c \ucca8\ubd80\uac00 \ub514\uc2a4\ud06c\ub97c \uc5bc\ub9c8\ub098 \uc4f0\ub294\uc9c0 \uc54c\ub824\uc8fc\uc9c0 \
\uc54a\uace0, \uad6c\ubc84\uc804\uc740 \uc544\uc608 \ubcf4\uc5ec\uc8fc\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uac19\uc740 \ud30c\uc77c\uc744 \uc11c\ub978 \ubc88 \uc62c\ub9ac\uba74 \ud398\uc774\uc9c0\uc5d0\ub294 \ud30c\uc77c \ud558\ub098\ub85c \
\ubcf4\uc774\uc9c0\ub9cc \ub514\uc2a4\ud06c\uc5d0\ub294 \uc11c\ub978 \uac1c\uac00 \uc788\uc2b5\ub2c8\ub2e4. \uc774 \uc571\uc740 \uadf8 \ub450 \uac00\uc9c0\ub97c \uce21\uc815\ud558\uace0, \uc5b4\ub290 \ubcf8\ubb38\uc5d0\uc11c\ub3c4 \
\ucc38\uc870\ud558\uc9c0 \uc54a\ub294 \ucca8\ubd80\ub97c \ucc3e\uc544\ub0c5\ub2c8\ub2e4.
aj.help.what.readonly = \uc9c0\uc6b0\ub294 \uac83\uc740 \ucca8\ubd80\uc758 \uad6c\ubc84\uc804\ubfd0\uc785\ub2c8\ub2e4. \uadf8\uac83\ub3c4 \ubbf8\ub9ac\ubcf4\uae30\ub97c \ud655\uc778\ud55c \
\ub4a4\uc5d0\ub9cc \uc9c0\uc6c1\ub2c8\ub2e4. \ucca8\ubd80 \uc790\uccb4\ub97c \uc9c0\uc6b0\uac70\ub098 \uc62e\uae30\uc9c0 \uc54a\uace0 \ud398\uc774\uc9c0\ub294 \uac74\ub4dc\ub9ac\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \ubc94\uc704\uac00 \uc774\ub807\uac8c \
\uc881\uc740 \uac83\uc740 \ubbf8\uc644\uc131\uc774 \uc544\ub2c8\ub77c \uc758\ub3c4\ud55c \uac83\uc785\ub2c8\ub2e4. \uc774 \uc571\uc758 \ubaa9\uc801\uc740 \uacb0\uc815\ud558\uae30 \uc804\uc5d0 \uadfc\uac70\ub97c \uc8fc\ub294 \uac83\uc774\uace0, \
\uc798\ubabb \ub204\ub974\uba74 \ubb34\uc5b8\uac00 \uc0ac\ub77c\uc9c8\uc9c0\ub3c4 \ubaa8\ub974\ub294 \ub3c4\uad6c\ub77c\uba74 \uad00\ub9ac\uc790\ub294 \uc2e4\ud589 \uc790\uccb4\ub97c \ub9dd\uc124\uc774\uac8c \ub429\ub2c8\ub2e4.


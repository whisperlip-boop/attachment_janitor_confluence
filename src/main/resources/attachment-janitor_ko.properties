\ud558\ub098\uc785\ub2c8\ub2e4 \u2014 \uc774 \ud30c\uc77c\uc774 \uc0ac\ub77c\uc9c0\uba74 \ubb34\uc5c7\uc774 \uae68\uc9c0\ub294\uac00. \uc5bc\ub9c8\ub098 \ud070\uc9c0, \uc911\ubcf5\uc778\uc9c0\ub294 \ubcc4\uac1c\uc758 \uae30\uc900\uc774\uace0 \
\uc544\ub798 \ud45c\uc2dc(\ubc30\uc9c0)\uc5d0\uc11c \ub2e4\ub8f9\ub2c8\ub2e4.
aj.help.col.label = \uc0c1\ud0dc
aj.help.col.condition = \uc5b8\uc81c \ubd99\ub294\uac00
aj.help.col.action = \ubb34\uc5c7\uc744 \ud558\uba74 \ub418\ub294\uac00
aj.help.labels.confusion = [\ucc38\uc870 \uc5c6\uc74c] \uacfc [\uc774\ub825\uc5d0\ub9cc \uc788\uc74c] \uc740 \uc808\ub300 \uc11e\uc73c\uba74 \uc548 \ub429\ub2c8\ub2e4. \
\ucc38\uc870 \uc5c6\ub294 \ud30c\uc77c\uc744 \uc9c0\uc6b0\uba74 \uc544\ubb34 \uc77c\ub3c4 \uc77c\uc5b4\ub098\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uc774\ub825\uc5d0\ub9cc \uc788\ub294 \ud30c\uc77c\ub3c4 \uc624\ub298\uc740 \uc544\ubb34 \uc77c\uc774 \
\uc5c6\uc2b5\ub2c8\ub2e4 \u2014 \uadf8\ub7ec\ub2e4 \ub204\uad70\uac00 \uc9c0\ub09c \ubd84\uae30 \ubc84\uc804\uc744 \uc5f4\uba74 \uae68\uc9c4 \uc774\ubbf8\uc9c0\ub97c \ubd05\ub2c8\ub2e4. \ub450 \uacbd\uc6b0 \ubaa8\ub450 \uc9c0\uae08 \
\ubcf4\uc774\ub294 \ud398\uc774\uc9c0\ub294 \ub611\uac19\uc774 \uba40\uca61\ud569\ub2c8\ub2e4. \uc774 \uc571\uc774 \uc874\uc7ac\ud558\ub294 \uc774\uc720 \uc911 \ud558\ub098\uac00 \uc774\uac83\uc785\ub2c8\ub2e4.
aj.help.labels.notrash = [\ud734\uc9c0\ud1b5] \uc0c1\ud0dc\ub294 \uc5c6\uc2b5\ub2c8\ub2e4. \ud398\uc774\uc9c0\ub97c \ud734\uc9c0\ud1b5\uc5d0 \ub123\uc73c\uba74 Confluence \uac00 \
\uadf8 \ucca8\ubd80\ub3c4 \uc0ad\uc81c \ud45c\uc2dc\ud558\ub294\ub370, \uc774 \ub9ac\ud3ec\ud2b8\uac00 \uc77d\ub294 API \ub294 \uc0ad\uc81c \ud45c\uc2dc\ub41c \ucca8\ubd80\ub97c \uc544\uc608 \ub3cc\ub824\uc8fc\uc9c0 \
\uc54a\uc2b5\ub2c8\ub2e4. \uc989 \uadf8 \uc0c1\ud0dc\ub294 \ub098\uc62c \uc218\uac00 \uc5c6\uc2b5\ub2c8\ub2e4. \ub098\uc62c \uc218 \uc5c6\ub294 \uc0c1\ud0dc\ub97c \ud45c\uc5d0 \uc801\uc5b4 \ub450\uba74 \
"\ud655\uc778\ud588\ub354\ub2c8 \uc5c6\ub354\ub77c"\ub85c \uc77d\ud788\ub294\ub370, \uadf8\uac74 \uc0ac\uc2e4\uc774 \uc544\ub2d9\ub2c8\ub2e4.


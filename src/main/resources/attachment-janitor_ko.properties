aj.help.what.body = Confluence \ub294 \uc2a4\ud398\uc774\uc2a4\ubcc4\ub85c \ucca8\ubd80\uac00 \ub514\uc2a4\ud06c\ub97c \uc5bc\ub9c8\ub098 \uc4f0\ub294\uc9c0 \uc54c\ub824\uc8fc\uc9c0 \
\uc54a\uace0, \uad6c\ubc84\uc804\uc740 \uc544\uc608 \ubcf4\uc5ec\uc8fc\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uac19\uc740 \ud30c\uc77c\uc744 \uc11c\ub978 \ubc88 \uc62c\ub9ac\uba74 \ud398\uc774\uc9c0\uc5d0\ub294 \ud30c\uc77c \ud558\ub098\ub85c \
\ubcf4\uc774\uc9c0\ub9cc \ub514\uc2a4\ud06c\uc5d0\ub294 \uc11c\ub978 \uac1c\uac00 \uc788\uc2b5\ub2c8\ub2e4. \uc774 \uc571\uc740 \uadf8 \ub458\uc744 \uc7ac\uace0, \uc5b4\ub290 \ubcf8\ubb38\uc5d0\uc11c\ub3c4 \ucc38\uc870\ud558\uc9c0 \
\uc54a\ub294 \ucca8\ubd80\ub97c \ucc3e\uc544\ub0c5\ub2c8\ub2e4.
aj.help.what.readonly = \uc0ad\uc81c\u00b7\uc774\ub3d9\u00b7\uc815\ub9ac\ub294 \uc77c\uc808 \ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \ubbf8\uc644\uc131\uc774\ub77c\uc11c\uac00 \uc544\ub2c8\ub77c \
\uc758\ub3c4\uc785\ub2c8\ub2e4. \uc774 \uc571\uc758 \ubaa9\uc801\uc740 \uacb0\uc815\ud558\uae30 \uc804\uc5d0 \uadfc\uac70\ub97c \uc8fc\ub294 \uac83\uc774\uace0, \uc798\ubabb \ub204\ub974\uba74 \ubb34\uc5b8\uac00 \uc0ac\ub77c\uc9c8\uc9c0\ub3c4 \
